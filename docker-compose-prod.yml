services:
  app:
    image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}:${IMAGE_TAG}
    container_name: app
    pull_policy: always

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Actuator health
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

      # Micrometer 비활성화
      MANAGEMENT_METRICS_BINDERS_PROCESSOR_ENABLED: "false"

      # JVM 메모리/GC 안전장치
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60.0
        -XX:InitialRAMPercentage=60.0
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heap.hprof

      # 스레드/DB 커넥션 제한
      SERVER_TOMCAT_THREADS_MAX: "100"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"

      SERVER_HOST_FRONT: https://newsintelligent.site
      SPRING_APPLICATION_JSON: >
        {"server":{"host":{"front":"${SERVER_HOST_FRONT}"}}}

    ports:
      - "8081:8080"

    restart: unless-stopped

    mem_limit: 768m
    mem_reservation: 256m
    cpus: "0.80"